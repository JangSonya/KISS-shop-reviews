<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KISS shop Reviews</title>
    <style>
        /* Красивый и простой дизайн сайта */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 500px; background: white; padding: 30px; margin: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .stars { margin: 20px 0; }
        .star { font-size: 40px; cursor: pointer; color: #ccc; transition: color 0.2s; }
        .star.active { color: #ffcc00; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; resize: none; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background-color: #218838; }
        /* Стили для твоего всплывающего окна "Халепа" */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-content h3 { color: #d9534f; margin-top: 0; }
        .close-btn { background: #d9534f; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Залишіть свій відгук</h1>
    <p>Нам дуже важлива ваша думка про наш магазин!</p>
    
    <!-- Звездочки для оценки -->
    <div class="stars">
        <span class="star" onclick="setRating(1)">★</span>
        <span class="star" onclick="setRating(2)">★</span>
        <span class="star" onclick="setRating(3)">★</span>
        <span class="star" onclick="setRating(4)">★</span>
        <span class="star" onclick="setRating(5)">★</span>
    </div>
    
    <!-- Поле для текста отзыва -->
    <textarea id="reviewText" placeholder="Напишіть кілька слів про наш магазин..."></textarea>
    
    <button onclick="submitReview()">Надіслати відгук</button>
</div>

<!-- Твое кастомное всплывающее окошко "Халепа" -->
<div id="halepaModal" class="modal">
    <div class="modal-content">
        <h3>Халепа! </h3>
        <p>Здається, ви наш хейтер. Змініть оцінку на вищу або залиште сайт.</p>
        <button class="close-btn" onclick="closeModal()">Змінити оцінку</button>
    </div>
</div>

<script>
    let currentRating = 0;

    // Логика выбора звездочек
    function setRating(rating) {
        currentRating = rating;
        const stars = document.querySelectorAll('.star');
        stars.forEach((star, index) => {
            if (index < rating) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    // Проверка при отправке
    function submitReview() {
        const text = document.getElementById('reviewText').value;

        if (currentRating === 0) {
            alert("Будь ласка, поставте оцінку зірочками!");
            return;
        }

        // Проверка твоей задумки (меньше 3 звезд — это 1 и 2 звезды)
        if (currentRating < 3) {
            document.getElementById('halepaModal').style.display = 'flex';
            return;
        }

        if (text.trim() === "") {
            alert("Будь ласка, напишіть текст відгуку.");
            return;
        }

        // Если всё ок (3, 4 или 5 звезд)
        alert("Дякуємо за ваш відгук!");
        
        // Очищаем форму
        setRating(0);
        document.getElementById('reviewText').value = "";
    }

    // Закрытие окошка "Халепа"
    function closeModal() {
        document.getElementById('halepaModal').style.display = 'none';
    }
</script>

</body>
</html>
